<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAD OPEN WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#43884b;font-family:Arial;color:white}
#game{display:block;width:100vw;height:100vh}
#title{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:23px;font-weight:bold;text-shadow:2px 2px #000}
#help{position:absolute;top:48px;width:100%;text-align:center;font-size:13px}
.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;align-items:end}
.group{display:flex;gap:10px}
button{width:64px;height:64px;border:2px solid white;border-radius:16px;background:#111b;color:white;font-size:25px;touch-action:none}
#gas{background:#167b35}
#brake{background:#a42b2b}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title">IMAD OPEN WORLD</div>
<div id="help">مدينة تجريبية • قد سيارتك باللمس</div>
<div class="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="brake">▼</button>
  <button id="gas">▲</button>
 </div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();addEventListener('resize',resize);
let car={x:0,y:0,a:0,speed:0};
let keys={left:false,right:false,gas:false,brake:false};
function bind(id,key){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
 b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[key]=false;
}
bind('left','left');bind('right','right');
bind('gas','gas');bind('brake','brake');
function road(x,y,w,h){
 ctx.fillStyle='#55595c';ctx.fillRect(x,y,w,h);
 ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.setLineDash([20,18]);
 if(w>h){ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke()}
 else{ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke()}
 ctx.setLineDash([]);
}
function frame(){
 const W=innerWidth,H=innerHeight;
 if(keys.gas)car.speed=Math.min(car.speed+0.12,5);
 else if(keys.brake)car.speed=Math.max(car.speed-0.18,-2);
 else car.speed*=0.985;
 if(keys.left)car.a-=0.045*(Math.abs(car.speed)/3+0.3);
 if(keys.right)car.a+=0.045*(Math.abs(car.speed)/3+0.3);
 car.x+=Math.sin(car.a)*car.speed;
 car.y-=Math.cos(car.a)*car.speed;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#43884b';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-car.x,H/2-car.y);
 road(-1000,-70,2000,140);
 road(-70,-1000,140,2000);
 road(-650,-500,1300,90);
 road(-500,350,1000,90);
 for(let x=-900;x<1000;x+=180){
  for(let y=-850;y<900;y+=180){
   if(Math.abs(x)<180||Math.abs(y)<180)continue;
   ctx.fillStyle='#27643b';ctx.fillRect(x+8,y+8,100,100);
   ctx.fillStyle=['#c5a27b','#d4d0c5','#b8755e','#8c9da5'][Math.abs((x+y)/180)%4|0];
   ctx.fillRect(x,y,100,100);
   ctx.fillStyle='#444';ctx.fillRect(x+12,y+12,20,20);
   ctx.fillRect(x+65,y+12,20,20);
   ctx.fillRect(x+12,y+65,20,20);
   ctx.fillRect(x+65,y+65,20,20);
  }
 }
 ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);
 ctx.fillStyle='#111';ctx.fillRect(-19,-25,38,55);
 ctx.fillStyle='#1768dc';ctx.fillRect(-15,-29,30,58);
 ctx.fillStyle='#aee8ff';ctx.fillRect(-11,-18,22,13);
 ctx.fillStyle='#111';ctx.fillRect(-11,7,22,12);
 ctx.fillStyle='#fff5a1';ctx.fillRect(-13,-28,8,4);ctx.fillRect(5,-28,8,4);
 ctx.restore();ctx.restore();
 ctx.fillStyle='white';ctx.font='bold 16px Arial';
 ctx.fillText('السرعة: '+Math.round(Math.abs(car.speed)*30)+' كم/س',12,H-105);
 requestAnimationFrame(frame);
}
frame();
</script>
</body>
  </html>
